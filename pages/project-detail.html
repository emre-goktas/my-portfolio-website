<div class="max-w-4xl mx-auto py-10 animate-fade-in" x-data="projectDetailApp">
    
    <!-- Loading State -->
    <div x-show="loading" class="flex justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-neonCyan"></div>
    </div>

    <!-- Error State -->
    <div x-show="error" style="display: none;" class="bg-red-900/20 border border-red-500 text-red-400 p-4 rounded text-center mb-8">
        <p x-text="error"></p>
        <a href="/projects" class="mt-4 px-4 py-2 border border-red-500 rounded hover:bg-red-500 hover:text-black transition-colors inline-block text-center mx-auto">Go Back</a>
    </div>

    <!-- Project Content (Loaded) -->
    <div x-show="!loading && !error && project" style="display: none;">
        
        <!-- Top Navigation -->
        <div class="mb-8 flex items-center justify-between border-b border-gray-800 pb-4">
            <a href="/projects"
               class="flex items-center text-neonCyan group">
                <svg class="h-5 w-5 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Projects
            </a>
        </div>

        <!-- Hero Media: single box, same style as the About Me page's video area -->
        <div class="w-full bg-darkCard rounded-2xl overflow-hidden border border-gray-800 shadow-xl border-glow-cyan relative mb-10"
            x-show="project?.screenshot || project?.gif || project?.video">
            <div class="aspect-video bg-black relative flex items-center justify-center">

                <!-- Video takes priority: local file -->
                <template x-if="project?.video && !(project.video.includes('youtube.com') || project.video.includes('youtu.be'))">
                    <video :src="project.video + '?t=' + new Date().getTime()" controls
                        :poster="project?.screenshot ? project.screenshot + '?t=' + new Date().getTime() : ''"
                        class="absolute top-0 left-0 w-full h-full object-cover rounded-2xl">
                        Tarayıcınız video etiketini desteklemiyor. Lütfen videoyu indirin veya modern bir tarayıcı kullanın.
                    </video>
                </template>

                <!-- Video: YouTube embed -->
                <template x-if="project?.video && (project.video.includes('youtube.com') || project.video.includes('youtu.be'))">
                    <iframe :src="project.video" class="absolute top-0 left-0 w-full h-full rounded-2xl" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
                </template>

                <!-- No video: GIF (auto-plays natively as an image) -->
                <template x-if="!project?.video && project?.gif">
                    <img :src="project.gif" class="absolute top-0 left-0 w-full h-full object-cover rounded-2xl">
                </template>

                <!-- No video, no gif: fall back to the screenshot -->
                <template x-if="!project?.video && !project?.gif && project?.screenshot">
                    <img :src="project.screenshot + '?t=' + new Date().getTime()" class="absolute top-0 left-0 w-full h-full object-cover rounded-2xl">
                </template>

            </div>
        </div>

        <!-- Markdown Rendered Content -->
        <article class="prose prose-invert prose-lg max-w-none prose-a:text-neonCyan hover:prose-a:text-neonPurple prose-headings:text-white prose-code:bg-gray-900 prose-code:text-neonCyan prose-code:px-1 prose-code:rounded prose-pre:bg-gray-900 prose-pre:border prose-pre:border-gray-800 prose-img:rounded-xl prose-img:border prose-img:border-gray-800 prose-img:shadow-lg"
                 x-html="markdownContent">
        </article>
        
        <!-- Bottom Navigation -->
        <div class="mt-16 pt-8 border-t border-gray-800 text-center">
            <a href="/projects"
               class="px-8 py-3 bg-darkCard border border-gray-700 hover:border-neonCyan text-neonCyan rounded-lg font-semibold tracking-wider transition-all duration-300 inline-block">
                View All Projects
            </a>
        </div>

    </div>
</div>

</div>
