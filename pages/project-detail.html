<div class="max-w-4xl mx-auto py-10 animate-fade-in" x-data="projectDetailApp">
    
    <!-- Loading State -->
    <div x-show="loading" class="flex justify-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-neonCyan"></div>
    </div>

    <!-- Error State -->
    <div x-show="error" style="display: none;" class="bg-red-900/20 border border-red-500 text-red-400 p-4 rounded text-center mb-8">
        <p x-text="error"></p>
        <a href="/projects" class="mt-4 px-4 py-2 border border-red-500 rounded hover:bg-red-500 hover:text-black transition-colors inline-block text-center mx-auto">Go Back</a>
    </div>

    <!-- Project Content (Loaded) -->
    <div x-show="!loading && !error && project" style="display: none;">
        
        <!-- Top Navigation -->
        <div class="mb-8 flex items-center justify-between border-b border-gray-800 pb-4">
            <a href="/projects" 
               class="flex items-center text-gray-400 hover:text-neonCyan transition-colors group">
                <svg class="h-5 w-5 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Projects
            </a>
        </div>

        <!-- Project Hero Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 drop-shadow-[0_0_10px_rgba(0,243,255,0.2)]" x-text="project?.title"></h1>
            <p class="text-xl text-gray-400 max-w-2xl mx-auto mb-6" x-html="project?.description"></p>
            
            <!-- Tags -->
            <div class="flex flex-wrap justify-center gap-2 mb-8">
                <template x-for="tag in project?.tags" :key="tag">
                    <span class="px-3 py-1 bg-neonPurple/10 border border-neonPurple/50 rounded-full text-xs font-semibold text-neonPurple backdrop-blur-sm"
                        x-text="tag"></span>
                </template>
            </div>

            <!-- Hero Media (Image / GIF / Video tabs) -->
            <div class="max-w-3xl mx-auto" x-data="{ mediaType: 'image' }"
                x-show="project?.screenshot || project?.gif || project?.video">

                <!-- Media Tabs -->
                <div class="mb-4 flex justify-center space-x-4 border-b border-gray-800 pb-2">
                    <button @click="mediaType = 'image'"
                        :class="{'text-neonCyan border-b-2 border-neonCyan': mediaType === 'image', 'text-gray-500 hover:text-gray-300': mediaType !== 'image'}"
                        class="pb-2 font-semibold uppercase tracking-wider text-sm transition-colors">Screenshot</button>

                    <template x-if="project?.gif">
                        <button @click="mediaType = 'gif'"
                            :class="{'text-neonCyan border-b-2 border-neonCyan': mediaType === 'gif', 'text-gray-500 hover:text-gray-300': mediaType !== 'gif'}"
                            class="pb-2 font-semibold uppercase tracking-wider text-sm transition-colors">GIF
                            Preview</button>
                    </template>

                    <template x-if="project?.video">
                        <button @click="mediaType = 'video'"
                            :class="{'text-neonCyan border-b-2 border-neonCyan': mediaType === 'video', 'text-gray-500 hover:text-gray-300': mediaType !== 'video'}"
                            class="pb-2 font-semibold uppercase tracking-wider text-sm transition-colors">Video</button>
                    </template>
                </div>

                <!-- Media Panel -->
                <div class="w-full bg-black rounded-2xl overflow-hidden border border-gray-800 shadow-xl border-glow-cyan flex justify-center items-center h-[400px] relative">

                    <div x-show="mediaType === 'image'" class="w-full h-full flex items-center justify-center p-4">
                        <img x-show="project?.screenshot" :src="project?.screenshot + '?t=' + new Date().getTime()"
                            class="max-w-full max-h-[360px] object-contain rounded-lg">
                    </div>

                    <div x-show="mediaType === 'gif'" class="w-full h-full flex items-center justify-center p-4"
                        style="display: none;">
                        <template x-if="project?.gif">
                            <img :src="project?.gif"
                                class="max-w-full max-h-[360px] object-contain rounded-lg border border-neonPurple/30 shadow-[0_0_15px_rgba(188,19,254,0.2)]">
                        </template>
                    </div>

                    <div x-show="mediaType === 'video'" class="w-full h-full flex items-center justify-center p-4"
                        style="display: none;">
                        <div class="w-full max-w-2xl aspect-video max-h-[360px] relative">
                            <template x-if="project?.video">
                                <div class="w-full h-full relative">
                                    <!-- Render iframe for YouTube links -->
                                    <template x-if="project.video.includes('youtube.com') || project.video.includes('youtu.be')">
                                        <iframe :src="project.video" class="w-full h-full rounded-lg absolute inset-0" frameborder="0"
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                            allowfullscreen></iframe>
                                    </template>

                                    <!-- Render standard HTML5 video player for local/direct links -->
                                    <template x-if="!(project.video.includes('youtube.com') || project.video.includes('youtu.be'))">
                                        <video :src="project.video + '?t=' + new Date().getTime()" class="w-full h-full rounded-lg absolute inset-0 object-cover" controls autoplay loop muted></video>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>
            </div>
        </header>

        <!-- Markdown Rendered Content -->
        <article class="prose prose-invert prose-lg max-w-none prose-a:text-neonCyan hover:prose-a:text-neonPurple prose-headings:text-white prose-code:bg-gray-900 prose-code:text-neonCyan prose-code:px-1 prose-code:rounded prose-pre:bg-gray-900 prose-pre:border prose-pre:border-gray-800 prose-img:rounded-xl prose-img:border prose-img:border-gray-800 prose-img:shadow-lg"
                 x-html="markdownContent">
        </article>
        
        <!-- Bottom Navigation -->
        <div class="mt-16 pt-8 border-t border-gray-800 text-center">
            <a href="/projects" 
               class="px-8 py-3 bg-darkCard border border-gray-700 hover:border-neonCyan hover:text-neonCyan rounded-lg font-semibold tracking-wider transition-all duration-300 inline-block">
                View All Projects
            </a>
        </div>

    </div>
</div>

</div>
